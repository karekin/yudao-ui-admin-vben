name: CloudMold admin web CI

on:
  push:
    branches:
      - master
      - feature/y-shopping-data-warehouse
      - cloudmold/main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudmold-admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck the active admin app
        run: pnpm --filter @vben/web-antd run typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build the active admin app
        run: pnpm build:antd

      - name: Reject localhost API endpoints in the release bundle
        run: >-
          ! grep --recursive --fixed-strings '127.0.0.1:48080' apps/web-antd/dist


      - name: Build immutable Demo image
        run: >-
          docker build --file scripts/deploy/cloudmold-demo.Dockerfile --build-arg VCS_REF="${GITHUB_SHA}" --tag "cloudmold/admin-web:${GITHUB_SHA}" .

